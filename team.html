      .team-grid {

        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: var(--primary-light);
        border: 3px solid var(--primary-light);
      }
      .member-links {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
      }
      .member-links a {
        color: var(--text-sub);
        font-size: 1.5rem;
        transition: 0.3s;
      }
      .member-links a:hover {
        color: var(--primary-color);
        transform: scale(1.2);
      }
